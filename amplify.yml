version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 requires Node >= 20.9. Pin the Amplify build image to Node 20.
        - nvm use 20 || nvm install 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # SSR/ISR app: the build output is .next (NOT `out` — that is only for static export).
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
